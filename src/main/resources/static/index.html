<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParcialFinal — Colegio UdeA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#1a237e;--primary-light:#3949ab;--accent:#ff6f00;--bg:#f5f5f5;--card:#fff;--text:#212121;--text-light:#757575;--success:#2e7d32;--error:#c62828;--warning:#ef6c00;--border:#e0e0e0;--radius:10px}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--primary);color:#fff;padding:1.2rem 2rem;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{font-size:1.4rem;font-weight:600}
header h1 span{color:var(--accent);font-weight:800}
#health-badge{font-size:.8rem;background:rgba(255,255,255,.15);padding:.4rem .8rem;border-radius:20px;display:flex;align-items:center;gap:.4rem}
#health-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block}
nav{background:#fff;border-bottom:1px solid var(--border);display:flex;gap:0;padding:0 2rem}
nav button{background:none;border:none;padding:.9rem 1.4rem;font-size:.95rem;font-weight:500;color:var(--text-light);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
nav button:hover{color:var(--primary)}
nav button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
main{max-width:900px;margin:2rem auto;padding:0 1.5rem}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 4px rgba(0,0,0,.08);padding:1.8rem;margin-bottom:1.5rem}
.card h2{font-size:1.15rem;margin-bottom:1rem;color:var(--primary);display:flex;align-items:center;gap:.5rem}
form{display:flex;flex-wrap:wrap;gap:.8rem;align-items:flex-end}
.form-group{display:flex;flex-direction:column;gap:.25rem;flex:1;min-width:140px}
.form-group label{font-size:.8rem;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select{padding:.55rem .7rem;border:1px solid var(--border);border-radius:6px;font-size:.9rem;transition:border-color .2s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 2px rgba(26,35,126,.1)}
button[type=submit],.btn-primary{background:var(--primary);color:#fff;border:none;padding:.6rem 1.4rem;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .2s}
button[type=submit]:hover,.btn-primary:hover{background:var(--primary-light)}
.btn-danger{background:var(--error)}
.btn-danger:hover{background:#b71c1c}
#result{margin-top:1.2rem;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.student-info{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.student-info .info-item{background:var(--bg);padding:.5rem 1rem;border-radius:6px;font-size:.85rem}
.student-info .info-item strong{color:var(--primary)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
table th{background:var(--primary);color:#fff;padding:.65rem .8rem;text-align:left;font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.5px}
table th:first-child{border-radius:6px 0 0 0}
table th:last-child{border-radius:0 6px 0 0}
table td{padding:.6rem .8rem;border-bottom:1px solid var(--border)}
table tr:hover td{background:rgba(26,35,126,.03)}
table .materia-badge{background:#e8eaf6;color:var(--primary);padding:.2rem .5rem;border-radius:4px;font-size:.78rem;font-weight:600}
.nota-badge{font-weight:700;font-size:.95rem}
.nota-alta{color:var(--success)}
.nota-media{color:var(--warning)}
.nota-baja{color:var(--error)}
.alert{padding:.8rem 1rem;border-radius:6px;font-size:.88rem;margin-top:1rem;display:flex;align-items:center;gap:.5rem}
.alert-success{background:#e8f5e9;color:var(--success);border:1px solid #a5d6a7}
.alert-error{background:#ffebee;color:var(--error);border:1px solid #ef9a9a}
.alert-warning{background:#fff3e0;color:var(--warning);border:1px solid #ffcc80}
details{margin-top:.6rem}
details summary{cursor:pointer;font-size:.82rem;color:var(--text-light)}
details pre{background:var(--bg);padding:.8rem;border-radius:6px;font-size:.78rem;overflow-x:auto;margin-top:.3rem}
.hidden{display:none!important}
.nota-created{background:#e8f5e9;border:1px solid #a5d6a7;border-radius:var(--radius);padding:1.2rem;margin-top:1rem}
.nota-created h3{color:var(--success);margin-bottom:.6rem;font-size:1rem}
.nota-created .field{display:flex;gap:.5rem;font-size:.88rem;margin-bottom:.3rem}
.nota-created .field strong{min-width:90px;color:var(--text-light)}
.section{display:none}
.section.active{display:block}
footer{text-align:center;padding:2rem;color:var(--text-light);font-size:.8rem}
</style>
</head>
<body>
<header>
  <h1><span>UdeA</span> Colegio — ParcialFinal</h1>
  <div id="health-badge"><span class="dot"></span><span id="health-text">Conectando...</span></div>
</header>
<nav>
  <button class="active" onclick="showSection('consultar')">Consultar Notas</button>
  <button onclick="showSection('registrar')">Registrar Nota</button>
</nav>

<main>
  <section id="sec-consultar" class="section active">
    <div class="card">
      <h2>Consultar notas de un estudiante</h2>
      <form id="form-consultar" onsubmit="consultarNotas(event)">
        <div class="form-group">
          <label for="cedula">Cédula del estudiante</label>
          <input type="text" id="cedula" name="cedula" placeholder="Ej: 1001234567" required>
        </div>
        <button type="submit">Buscar</button>
      </form>
      <div id="result-consultar"></div>
    </div>
  </section>

  <section id="sec-registrar" class="section">
    <div class="card">
      <h2>Registrar una nueva nota</h2>
      <form id="form-registrar" onsubmit="registrarNota(event)">
        <div class="form-group">
          <label for="cedula-est">Cédula estudiante</label>
          <input type="text" id="cedula-est" name="cedulaEstudiante" placeholder="Ej: 1001234567" required>
        </div>
        <div class="form-group">
          <label for="codigo-mat">Código materia</label>
          <input type="text" id="codigo-mat" name="codigoMateria" placeholder="Ej: ING303" required>
        </div>
        <div class="form-group">
          <label for="valor">Nota (0.0 - 5.0)</label>
          <input type="number" id="valor" name="valor" step="0.01" min="0" max="5" placeholder="4.5" required>
        </div>
        <div class="form-group">
          <label for="periodo">Periodo</label>
          <input type="text" id="periodo" name="periodo" placeholder="Ej: 2026-1" required>
        </div>
        <div class="form-group">
          <label for="observaciones">Observaciones</label>
          <input type="text" id="observaciones" name="observaciones" placeholder="Opcional">
        </div>
        <button type="submit">Registrar</button>
      </form>
      <div id="result-registrar"></div>
    </div>
  </section>
</main>

<footer>ParcialFinal Arquitectura de Software — UdeA 2026-1</footer>

<script>
const API = '/api/v1';

function showSection(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-' + name).classList.add('active');
  event.target.classList.add('active');
}

async function api(path, opts) {
  const res = await fetch(API + path, opts);
  const data = await res.json();
  data._status = res.status;
  return data;
}

function notaClass(v) {
  if (v >= 4.0) return 'nota-alta';
  if (v >= 3.0) return 'nota-media';
  return 'nota-baja';
}

function alertHtml(type, msg, details) {
  let html = `<div class="alert alert-${type}">${msg}</div>`;
  if (details) {
    html += `<details><summary>Ver detalles</summary><pre>${JSON.stringify(details, null, 2)}</pre></details>`;
  }
  return html;
}

async function consultarNotas(e) {
  e.preventDefault();
  const cedula = document.getElementById('cedula').value.trim();
  const el = document.getElementById('result-consultar');
  el.innerHTML = '<p style="color:var(--text-light);margin-top:1rem">Buscando...</p>';

  try {
    const data = await api('/estudiantes/' + encodeURIComponent(cedula) + '/notas');
    if (data._status === 200) {
      let html = `<div class="student-info">
        <div class="info-item"><strong>Cédula:</strong> ${data.cedula}</div>
        <div class="info-item"><strong>Nombre:</strong> ${data.nombreCompleto}</div>
        <div class="info-item"><strong>Programa:</strong> ${data.programa}</div>
        <div class="info-item"><strong>Notas:</strong> ${data.notas.length}</div>
      </div>`;
      if (data.notas.length) {
        html += '<table><thead><tr><th>Materia</th><th>Código</th><th>Nota</th><th>Periodo</th><th>Fecha</th><th>Observaciones</th></tr></thead><tbody>';
        data.notas.forEach(n => {
          html += `<tr>
            <td><span class="materia-badge">${n.materia.nombre}</span></td>
            <td>${n.materia.codigo}</td>
            <td><span class="nota-badge ${notaClass(n.valor)}">${n.valor.toFixed(1)}</span></td>
            <td>${n.periodo}</td>
            <td>${n.fechaRegistro}</td>
            <td>${n.observaciones || '—'}</td>
          </tr>`;
        });
        html += '</tbody></table>';
      } else {
        html += '<p style="color:var(--text-light);margin-top:.5rem">Este estudiante no tiene notas registradas.</p>';
      }
      el.innerHTML = html;
    } else {
      el.innerHTML = alertHtml('error', data.mensaje || 'Error inesperado', data);
    }
  } catch (err) {
    el.innerHTML = alertHtml('error', 'Error de conexión con el servidor');
  }
}

async function registrarNota(e) {
  e.preventDefault();
  const el = document.getElementById('result-registrar');
  const body = {
    cedulaEstudiante: document.getElementById('cedula-est').value.trim(),
    codigoMateria: document.getElementById('codigo-mat').value.trim(),
    valor: parseFloat(document.getElementById('valor').value),
    periodo: document.getElementById('periodo').value.trim()
  };
  const obs = document.getElementById('observaciones').value.trim();
  if (obs) body.observaciones = obs;

  try {
    const data = await api('/notas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (data._status === 201) {
      el.innerHTML = `<div class="nota-created">
        <h3>Nota registrada exitosamente</h3>
        <div class="field"><strong>Estudiante:</strong> ${data._status}</div>
        <div class="field"><strong>Nota:</strong> <span class="${notaClass(data.valor)}">${data.valor.toFixed(1)}</span></div>
        <div class="field"><strong>Materia:</strong> ${data.materia.codigo} — ${data.materia.nombre}</div>
        <div class="field"><strong>Periodo:</strong> ${data.periodo}</div>
        <div class="field"><strong>Observaciones:</strong> ${data.observaciones || '—'}</div>
      </div>`;
      document.getElementById('form-registrar').reset();
    } else {
      let msg = data.mensaje || 'Error al registrar la nota';
      let detailItems = '';
      if (data.detalles && data.detalles.length) {
        detailItems = '<ul style="margin:.4rem 0 0 1rem;font-size:.82rem">';
        data.detalles.forEach(d => { detailItems += `<li><strong>${d.campo}:</strong> ${d.mensaje}</li>`; });
        detailItems += '</ul>';
      }
      el.innerHTML = `<div class="alert alert-error">${msg}${detailItems}</div>`;
    }
  } catch (err) {
    el.innerHTML = alertHtml('error', 'Error de conexión con el servidor');
  }
}

async function checkHealth() {
  const badge = document.getElementById('health-text');
  try {
    const data = await api('/health');
    if (data.estado === 'UP') {
      badge.textContent = 'Servicio UP — DB ' + (data.baseDeDatos?.estado || '?');
    } else {
      badge.textContent = 'Servicio DEGRADED';
      document.querySelector('#health-badge .dot').style.background = 'var(--warning)';
    }
  } catch {
    badge.textContent = 'Sin conexión';
    document.querySelector('#health-badge .dot').style.background = 'var(--error)';
  }
}

checkHealth();
</script>
</body>
</html>
